<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Капитал</title>
    <meta name="description" content="Личные финансы: кошельки, операции, аналитика, цели, бюджеты и планы" />

    <meta name="theme-color" content="#070708" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Капитал" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/mark.svg" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <style>
      html, body { background: #070708; }
      html[data-theme="light"], body[data-theme="light"], html:has(> body[data-theme="light"]) { background: #F3F1EC; }
      html:has(> body[data-theme="dark"]) { background: #070708; }
      /* iOS 26 short-viewport fix for installed apps — see styles/index.css */
      @media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); } }
    </style>
    <script>
      // Apply the saved theme before first paint, so there is no flash.
      (function () {
        try {
          // A small mirror of visual settings (the data itself lives in IndexedDB).
          var p = JSON.parse(localStorage.getItem("kapital-prefs") || "null");
          if (!p) {
            var raw = localStorage.getItem("kapital-v2");
            p = raw ? (JSON.parse(raw).state || {}).settings : null;
          }
          var t = p && p.theme ? p.theme : "dark";
          if (t === "system") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", t);
          if (p && p.numberFont) root.setAttribute("data-num", p.numberFont);
          if (p && p.accent) root.setAttribute("data-accent", p.accent);
          if (p && p.textSize) root.setAttribute("data-text", p.textSize);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
